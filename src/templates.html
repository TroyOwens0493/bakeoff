><span>b.</span> budget together</a><h1>Manage your finances, together.</h1><div class="intro-rule">Make your money work for you</div></div><section class="auth-card"><p class="eyebrow">WELCOME TOGETHER</p><h2>Reset your password</h2><form data-auth="request"><label>Email<input name="email" type="email" required autocomplete="email"></label><button type="submit">Send reset link</button><p data-message aria-live="polite"></p></form><div class="auth-links"><a href="/">Back to sign in</a></div></section></main></template><template id="auth-reset"><main class="auth-shell"><div class="auth-intro"><a class="brand" href="/"><span>b.</span> budget together</a><h1>Manage your finances, together.</h1><div class="intro-rule">Make your money work for you</div></div><section class="auth-card"><p class="eyebrow">WELCOME TOGETHER</p><h2>Choose a new password</h2><form data-auth="reset"><label>Password<input name="password" type="password" required minlength="12" autocomplete="new-password"><small>Use at least 12 characters.</small></label><button type="submit">Save password</button><p data-message aria-live="polite"></p></form><div class="auth-links"><a href="/">Back to sign in</a></div></section></main></template><template id="onboarding"><main class="auth-card"><p class="eyebrow">LET’S GET STARTED</p><h1>Make room for your plans.</h1><p>Your accounts start in your private budget. You can connect a bank after this step.</p><form data-op="budgets:setup"><label>Your name<input name="name" required maxlength="100"></label><label>Reporting time zone<input name="timeZone" data-local-timezone value="America/Boise" required></label><button type="submit">Create my private budget</button><p data-message role="alert"></p></form><button type="button" class="secondary" data-sign-out>Sign out</button><p data-global-message role="status" hidden></p></main></template><template id="budget-shell"><div class="app-shell"><aside class="sidebar"><a class="brand" href="/"><span>b.</span> budget together</a><form method="get"><input type="hidden" name="view"><input type="hidden" name="month"><label class="space-select"><span class="eyebrow">YOUR SPACE</span><select name="space" aria-label="Budget space" data-navigate-select></select></label></form><nav aria-label="Main navigation"><a class="nav-item" data-view="overview" href="/?view=overview"><span aria-hidden="true">◫</span>Overview</a><a class="nav-item" data-view="transactions" href="/?view=transactions"><span aria-hidden="true">↔</span>Transactions</a><a class="nav-item" data-view="budget" href="/?view=budget"><span aria-hidden="true">▦</span>Monthly budget</a><a class="nav-item" data-view="review" href="/?view=review"><span aria-hidden="true">✓</span>Monthly review</a><a class="nav-item" data-view="accounts" href="/?view=accounts"><span aria-hidden="true">▤</span>Accounts &amp; settings</a></nav><div class="sidebar-bottom"><a class="nav-item" data-view="profile" href="/?view=profile">⚙ Settings</a><button class="nav-item" type="button" data-sign-out>↪ Sign out</button></div></aside><main class="main-content"><header class="topbar"><span><span data-text="household"></span> <span class="slash">/</span> <strong data-text="pageName"></strong></span><div><details class="alerts"><summary aria-label="Alerts" data-alert-summary>♧<span class="notification-dot" data-show="unread" hidden></span></summary><section class="panel"><h2>Your alerts</h2><p data-show="noAlerts">No category alerts this month.</p><div data-list="alerts"></div><template data-row="alerts"><div class="alert-row"><p data-text="message"></p><button type="button" class="secondary" data-op="budgets:readAlert">Mark read</button></div></template></section></details><form method="get"><input type="hidden" name="view"><input type="hidden" name="space"><label class="month-picker"><span class="sr-only">Reporting month</span><input type="month" name="month" data-navigate-select required></label></form><span class="avatar" data-text="initials"></span></div></header><p class="banner" data-show="left" hidden>You left this budget. Records shared before you left are available to read.</p><div class="banner" data-live-change hidden role="alert">This page changed. Your unsaved entries are still here. <button type="button" class="secondary" data-reload>Load current values</button></div><div class="save-notice" data-global-message aria-live="polite" hidden></div><div data-view-content></div></main></div></template><template id="view-overview"><div><div class="page-actions"><a class="button secondary" data-view="budget" href="/?view=budget">Edit monthly plan</a></div><div class="summary-grid"><article class="summary-card"><span>Money in</span><strong data-text="moneyIn"></strong><small><span data-text="expected"></span> expected income · <span data-text="incoming"></span> planned budget funding</small></article><article class="summary-card"><span>Money out</span><strong data-text="spending"></strong><small><span data-text="pending"></span> pending, separate from totals</small></article><article class="summary-card green"><span>Saved this month</span><strong data-text="savings"></strong><small><span data-text="relative"></span> relative to your <span data-text="target"></span> target</small></article></div><p class="banner" data-show="noPlan" hidden>Start with your monthly plan. Add expected income, category limits, and a savings target.</p><div class="dashboard-grid"><section class="panel"><h2>Category balances</h2><div data-list="balances"></div><template data-row="balances"><div class="category-row"><span class="category-icon">◒</span><div class="category-main"><div><strong data-text="name"></strong><small data-text="used"></small></div><div class="progress-track"><div data-progress></div></div></div><div class="category-balance"><strong data-text="left"></strong><small data-text="remaining"></small></div></div></template></section><section class="panel"><div class="section-heading"><h2>Spending over time</h2><form method="get"><input type="hidden" name="space"><input type="hidden" name="month"><label><span class="sr-only">Chart category</span><select name="chartCategory" data-navigate-select></select></label></form></div><div class="bar-chart" role="img" aria-label="Monthly spending by category. Refunds extend below zero. Exact values are in the table below." data-chart></div><template data-chart-month><div aria-hidden="true"><div class="spending-bar"><span class="spending-zero"></span></div><small></small></div></template><table class="compact-table"><caption class="sr-only">Monthly spending in US dollars</caption><thead><tr><th>Month</th><th>Spending</th></tr></thead><tbody data-list="reports"></tbody></table><template data-row="reports"><tr><td data-text="month"></td><td data-text="amount"></td></tr></template></section></div><section class="panel activity"><div class="section-heading"><h2>Recent activity</h2><a data-view="transactions" href="/?view=transactions">All transactions →</a></div><div data-list="activity"></div><p class="empty-state" data-show="noActivity">Connect an account to see your activity here.</p><template data-row="activity"><div class="activity-row"><span class="category-icon">↔</span><div><strong data-text="description"></strong><small data-text="detail"></small></div><strong data-text="amount"></strong></div></template></section><section class="panel" data-show="recurring"><h2>Recurring-charge suggestions</h2><p>Estimates from at least three similar monthly charges. No money is moved.</p><div data-list="recurring"></div><template data-row="recurring"><div class="alert-row"><span><strong data-text="merchant"></strong><small data-text="detail"></small></span><div class="button-row"><button type="button" class="secondary" data-status="confirmed" data-op="budgets:setRecurring">Confirm</button><button type="button" class="secondary" data-status="dismissed" data-op="budgets:setRecurring">Dismiss</button></div></div></template></section></div></template><template id="view-budget"><div><form data-op="budgets:savePlan" data-transform="plan" class="plan-grid"><section class="panel"><h2>Monthly spending</h2><fieldset><div data-show="funded" hidden><p>Income is planned in the shared budget. Your personal allocation is <span data-text="personalIncoming"></span> for this month.</p></div><div data-show="ownIncome"><label><span data-money-label>Expected take-home income</span><span class="money-input"><span>$</span><input name="expectedIncome" value="0.00" inputmode="decimal" required pattern="-?[0-9]+([.][0-9]{1,2})?"></span></label></div><div data-list="limits"></div><template data-row="limits"><div><label><span data-money-label>Category limit</span><span class="money-input"><span>$</span><input name="limit" value="0.00" inputmode="decimal" required pattern="-?[0-9]+([.][0-9]{1,2})?"></span></label></div></template><div class="divider"></div><label><span data-money-label>Monthly savings target</span><span class="money-input"><span>$</span><input name="savingsTarget" value="0.00" inputmode="decimal" required pattern="-?[0-9]+([.][0-9]{1,2})?"></span></label><p class="muted">Category limits repeat next month. Allocate all available money, then save your budget.</p></fieldset></section><aside class="panel green plan-summary"><p class="eyebrow">THE BIG PICTURE</p><h2>Money available to plan</h2><strong class="big-number" data-plan-available></strong><dl><div class><dt>Expected income</dt><dd data-plan-income></dd></div><div class><dt>Incoming budget funding</dt><dd data-plan-incoming></dd></div><div class><dt>Carry-forward</dt><dd data-plan-carry></dd></div><div class><dt>Outgoing budget funding</dt><dd data-plan-outgoing></dd></div><div class><dt>Spending limits</dt><dd data-plan-limits></dd></div><div class><dt>Savings target</dt><dd data-plan-target></dd></div><div class="total"><dt>Left to allocate</dt><dd data-plan-balance></dd></div></dl><p data-plan-hint></p><button type="submit">Save budget</button><p data-message role="alert"></p></aside></form><section class="panel" data-show="people" hidden><h2>Personal budget funding</h2><p>Assign a monthly amount to each personal budget. It reduces shared funding and is available at once. No bank transfer is needed.</p><p class="muted">Both partners can change these amounts. Personal spending and transactions stay private. After a change, balance and save the affected budgets.</p><div data-list="people"></div><template data-row="people"><form class="inline-form" data-op="personalAllocations:save" data-money="amount"><fieldset><label><span data-money-label>Personal amount</span><span class="money-input"><span>$</span><input name="amount" value="0.00" inputmode="decimal" required pattern="-?[0-9]+([.][0-9]{1,2})?"></span></label><button type="submit">Save amount</button><p data-message role="alert"></p></fieldset></form></template></section><button class="secondary" type="button" data-op="budgets:repeatPlan" data-show="repeat" data-success="Limits copied. Open next month to finish and save your budget.">Copy limits to <span data-text="nextMonth"></span></button></div></template><template id="view-review"><div><div class="summary-grid"><article class="summary-card"><span>Money in</span><strong data-text="moneyIn"></strong><small><span data-text="expected"></span> expected income · <span data-text="incoming"></span> planned budget funding</small></article><article class="summary-card"><span>Money out</span><strong data-text="spending"></strong><small><span data-text="pending"></span> pending, separate from totals</small></article><article class="summary-card green"><span>Saved this month</span><strong data-text="savings"></strong><small><span data-text="relative"></span> relative to your <span data-text="target"></span> target</small></article></div><form class="panel" data-op="budgets:review" data-transform="review"><div class="review-totals"><div><span>Available to allocate</span><strong data-text="available"></strong></div><div><span>Remaining</span><strong data-review-remaining></strong></div></div><fieldset><div data-rows></div><template data-row-template><div class="carry-row" data-allocation-row><label><span class>Destination</span><select name="categoryId"></select></label><label><span class>Amount</span><input name="allocationAmount" value="0.00" inputmode="decimal" required></label><button type="button" class="text-button" data-remove-row aria-label="Remove allocation">×</button></div></template><button type="button" class="secondary" data-add-row>Add allocation</button><div class="retained"><span>Keep in <span data-text="month"></span> savings<small>Unassigned savings remain here.</small></span><strong data-review-retained></strong></div><dl><div><dt>Carry forward to <span data-text="nextMonth"></span></dt><dd data-review-reserved></dd></div><div><dt>Original monthly savings result</dt><dd data-text="savings"></dd></div></dl><p class="muted">Reserving funds does not change this month’s income, spending, savings, or target. Late bank corrections can require a new review.</p><p data-show="notSaved">Save this month’s budget before completing its review.</p><button type="submit" data-review-save>Complete monthly review</button><p data-message role="alert"></p></fieldset></form></div></template><template id="view-transactions"><div><div class="page-actions"><div class="button-row" data-show="editable"><a class="button secondary" data-edit-category href="/?view=transactions&categoryEdit=new">Manage categories</a><a class="button" data-edit-transaction href="/?view=transactions&edit=new">Add transaction</a></div></div><div data-editor></div><section class="panel table-panel"><form method="get" class="filters" data-filters><input type="hidden" name="view" value="transactions"><input type="hidden" name="space"><input type="hidden" name="month"><label class="search-input"><span class="sr-only">Search descriptions and notes</span><input name="search" placeholder="Search transactions"></label><label><span class="sr-only">Account filter</span><select name="accountId"></select></label><label><span class="sr-only">Category filter</span><select name="categoryId"></select></label><button type="submit">Filter</button></form><div class="table-scroll"><table><thead><tr><th>Date</th><th>Transaction</th><th>Category</th><th>Account</th><th>Amount</th></tr></thead><tbody data-list="transactions"></tbody></table></div><template data-row="transactions"><tr><td data-text="date"></td><td><a class="transaction-button" data-transaction-link></a><small data-text="detail"></small></td><td><span class="tag" data-text="category"></span></td><td data-text="account"></td><td data-text="amount"></td></tr></template><p class="empty-state" data-show="empty">No transactions match these filters.</p><div class="pagination" data-show="pagination"><span><span data-text="total"></span> matching transactions</span><a data-page="first">First page</a><a data-page="next">Next page</a></div></section></div></template><template id="editor-transaction"><section class="panel editor" aria-label="Transaction editor"><div class="section-heading"><h2 data-text="title">Transaction details</h2><a data-close-editor href="/?view=transactions">Close</a></div><form data-op="budgets:saveTransaction" data-transform="transaction"><fieldset><label>Account<select name="accountId" required></select><input type="hidden" name="accountId" data-fixed-account disabled></label><p data-show="noAccount">Connect a bank in Accounts & settings first.</p><label>Description<input name="description" required maxlength="200"></label><label><span data-money-label>Amount (positive for outflow; negative for income or refund)</span><span class="money-input"><span>$</span><input name="amount" value="0.00" inputmode="decimal" required pattern="-?[0-9]+([.][0-9]{1,2})?"></span></label><label>Date<input name="date" type="date" required></label><p class="muted" data-show="imported">Imported amount, date and pending status are set by the bank. Bank amount: <span data-text="bankAmount"></span>.</p><label>Classification<select name="kind" data-classification><option value="purchase">Purchase or refund</option><option value="income">Income</option><option value="transfer">Transfer or credit card payment</option></select></label><section data-splits><h3>Category splits</h3><div data-rows></div><template data-row-template><div class="split-row" data-allocation-row><label><span class="sr-only">Category for split</span><select name="categoryId" required></select></label><label><span class="sr-only">Amount</span><input name="allocationAmount" value="0.00" inputmode="decimal" required></label><button type="button" class="text-button" data-remove-row aria-label="Remove split">×</button></div></template><button type="button" class="secondary" data-add-row>Add split</button><p class="muted">Split amounts must total the transaction amount, including its sign.</p></section><label>Note<textarea name="note" maxlength="2000"></textarea></label><label class="checkbox" data-show="manualPending"><input name="pending" type="checkbox">Pending</label><div class="button-row"><button type="submit">Save transaction</button><button type="button" class="danger" data-op="budgets:deleteTransaction" data-show="delete" data-confirm="Delete this manual transaction?">Delete manual entry</button></div><p data-message role="alert"></p></fieldset></form><form class="reconcile" data-op="budgets:reconcile" data-show="reconcile"><h3>Match an imported entry</h3><p>Keep the imported entry and apply this manual entry’s categories and note. The manual entry will stop counting.</p><label>Imported transaction<select name="importId" required></select></label><button type="submit">Match entries</button><p data-message role="alert"></p></form></section></template><template id="editor-category"><section class="panel editor" role="region" aria-label="Manage categories"><div class="section-heading"><h2>Manage categories</h2><a data-close-editor href="/?view=transactions">Close</a></div><form method="get"><input type="hidden" name="view" value="transactions"><input type="hidden" name="space"><input type="hidden" name="month"><label>Category<select name="categoryEdit" data-navigate-select></select></label></form><form data-op="budgets:saveCategory"><fieldset><label>Name<input name="name" required maxlength="100"></label><label>Color<input type="color" name="color" value="#83aaa2"></label><button type="submit" data-text="saveLabel">Create category</button><p data-message role="alert"></p></fieldset></form><form class="reconcile" data-op="budgets:deleteCategory" data-show="deleteCategory" data-confirm="Delete this category and reassign its transactions, limits, and carry-forward?"><h3>Delete this category</h3><p>Choose where to move its transactions, plan limits, and carry-forward allocations.</p><label>Replacement<select name="replacementId" required></select></label><button type="submit" class="danger">Delete and reassign</button><p data-message role="alert"></p></form></section></template><template id="view-accounts"><div><div class="page-actions"><button type="button" data-bank-link>Connect a bank</button></div><section class="panel editor" data-show="bankReview" hidden><div class="section-heading"><h2>Check possible duplicate accounts</h2><a data-close-bank-review href="/?view=accounts">Close</a></div><p>No transactions will import until you complete this check. A match uses the bank, account type, and last four digits of an account connected by you or your partner.</p><form data-op="bank:confirmAccounts" data-transform="bankReview"><div data-list="decisions"></div><template data-row="decisions"><label><span data-text="account"></span><select required><option value="">Is this an account already connected?</option><option value="same">Same account — keep the existing connection</option><option value="different">Different account — import this account</option></select></label></template><p>Other selected accounts will import with this connection.</p><button type="submit">Confirm accounts</button><p data-message role="alert"></p></form></section><section class="panel"><h2>Accounts in this budget</h2><div data-list="accounts"></div><p class="empty-state" data-show="noAccounts">No accounts yet. Connect a bank to import transactions automatically.</p><template data-row="accounts"><div class="account-row"><div><strong data-text="name"></strong><small data-text="detail"></small></div><div class="account-controls" data-show="editable"><details><summary>Rename</summary><form data-op="accounts:rename"><label>Account name<input name="name" required maxlength="100"></label><button type="submit">Save account name</button><p data-message role="alert"></p></form></details><details data-show="move"><summary>Move account</summary><p>Only transactions from today onward will be assigned to the destination budget. Earlier records stay in their current budget. Existing private history stays private. Earlier shared history remains available to both partners.</p><p><strong>Destination budget</strong><br><span data-text="destination"></span></p><button type="button" class="secondary" data-op="accounts:move" data-confirm="Move this account from today onward? Earlier history stays in its original budget.">Confirm account move</button></details></div></div></template></section><section class="panel"><h2>Your bank connections</h2><div data-list="connections"></div><p data-show="noConnections">No bank connections yet.</p><template data-row="connections"><div class="connection-row"><div><strong data-text="institution"></strong><small data-text="detail"></small><p class="over" data-text="error" data-show="error"></p></div><div class="button-row"><a class="button" data-review-link data-show="review">Review accounts</a><button type="button" class="secondary" data-op="bank:sync" data-kind="action" data-success="Sync requested. Check the connection status below.">Sync</button><button type="button" class="secondary" data-bank-link>Reconnect</button><button type="button" class="secondary" data-op="bank:disconnect" data-kind="action" data-confirm="Disconnect this bank? Imported history will be kept." data-success="Disconnected. History retained.">Disconnect</button></div></div></template></section><section class="panel narrow" data-show="sharing"><h2>Your shared budget</h2><div class="banner" data-show="invite"><p>You have an invitation. Accept it with the email address that received the invitation.</p><button type="button" data-op="sharing:accept" data-kind="action">Accept invitation</button></div><div data-show="createShared"><p>You can share one budget with one partner. Each of you has equal control. Your private budget remains separate.</p><button type="button" class="secondary" data-op="sharing:create" data-args="{}">Create shared budget</button></div><div data-show="sharedDetails"><button type="button" class="danger" data-op="sharing:leave" data-show="leave" data-confirm="Leave this shared budget? Your accounts return to your private budget. The other partner keeps this budget. You keep read access to previously shared records.">Leave shared budget</button><p data-text="members"></p><form data-op="sharing:invite" data-kind="action" data-success="Invitation queued for email delivery."><label>Partner’s email<input name="email" type="email" required></label><button type="submit">Send invitation</button><p data-message role="alert"></p></form><div data-list="invitations"></div><template data-row="invitations"><div class="alert-row"><span><span data-text="email"></span><small data-text="detail"></small></span><button type="button" class="secondary" data-op="sharing:revoke" data-show="revoke">Revoke</button></div></template></div></section><div data-contributions></div></div></template><template id="view-contributions"><section class="panel"><h2>Funding your shared budget</h2><p>A contribution reduces private funding and adds the same amount to shared funding. It is separate from earned income.</p><p class="muted">After changing the planned amount, balance and save both monthly budgets.</p><form class="inline-form" data-op="contributions:savePlanned" data-money="planned"><label><span data-money-label>Planned contribution</span><span class="money-input"><span>$</span><input name="planned" value="0.00" inputmode="decimal" required pattern="-?[0-9]+([.][0-9]{1,2})?"></span></label><button type="submit">Save planned amount</button><p data-message role="alert"></p></form><h3>Suggested bank matches</h3><p>Confirm a match only when these entries record the same transfer.</p><div data-list="suggestions"></div><template data-row="suggestions"><div class="alert-row"><span><strong data-text="amount"></strong><small data-text="detail"></small></span><button type="button" class="secondary" data-op="contributions:confirm">Confirm match</button></div></template><p class="muted" data-show="noSuggestions">No matching posted transfers found. Classify an outgoing personal entry as a transfer to suggest its matching shared deposit.</p><h3>Confirmed contributions</h3><div data-list="pairs"></div><template data-row="pairs"><div class="alert-row"><span data-text="amount"></span><button type="button" class="secondary" data-op="contributions:unmatch">Remove match</button></div></template></section></template><template id="view-profile"><div><form class="panel narrow" data-profile><label>Name<input name="name" required maxlength="100"></label><label>Email<input data-profile-email readonly type="email"></label><label>Time zone<input name="timeZone" required></label><button type="submit">Save profile</button><p data-message role="alert"></p></form><details class="panel narrow"><summary>Change password</summary><form data-auth="changePassword"><label>Current password<input name="currentPassword" type="password" autocomplete="current-password" required></label><label>New password<input name="newPassword" type="password" minlength="12" autocomplete="new-password" required></label><button type="submit">Save password</button><p data-message role="alert"></p></form></details></div></template>
